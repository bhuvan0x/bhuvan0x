<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">Bhuvan — build what is next</title>
  <desc id="desc">A dark technical hero graphic with electric violet and cyan accents, a large 0x monogram, and the message ideas into systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset=".55" stop-color="#10172A"/>
      <stop offset="1" stop-color="#11102B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B8CFF"/>
      <stop offset=".52" stop-color="#6E7BFF"/>
      <stop offset="1" stop-color="#39D8E6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A78BFA" stop-opacity=".9"/>
      <stop offset="1" stop-color="#39D8E6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx=".48" cy=".48" r=".6">
      <stop offset="0" stop-color="#7667FF" stop-opacity=".38"/>
      <stop offset=".65" stop-color="#3DD8E6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#11102B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#A9B4D0" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="1280" height="390" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="390" rx="22" fill="url(#grid)"/>
  <ellipse cx="1000" cy="190" rx="265" ry="220" fill="url(#orb)"/>
  <ellipse cx="1020" cy="192" rx="140" ry="140" fill="#6D63FF" opacity=".12" filter="url(#soft)"/>
  <path d="M0 315H1280" stroke="url(#line)" stroke-width="1"/>
  <path d="M790 0V390" stroke="#A9B4D0" stroke-opacity=".10" stroke-dasharray="3 8"/>
  <g fill="none" stroke="url(#glow)">
    <circle cx="1010" cy="184" r="116" stroke-width="1.5" opacity=".9"/>
    <circle cx="1010" cy="184" r="91" stroke-width="1" opacity=".55" stroke-dasharray="3 7"/>
    <ellipse cx="1010" cy="184" rx="150" ry="53" stroke-width="1.2" opacity=".7" transform="rotate(-32 1010 184)"/>
    <ellipse cx="1010" cy="184" rx="150" ry="53" stroke-width="1.2" opacity=".5" transform="rotate(48 1010 184)"/>
  </g>
  <circle cx="1092" cy="92" r="6" fill="#45E3D3"/>
  <circle cx="887" cy="265" r="4" fill="#A78BFA"/>
  <circle cx="1128" cy="246" r="3" fill="#45E3D3"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="74" y="61" font-size="13" font-weight="700" letter-spacing="4" fill="#8C9AB8">BHUVAN0X <tspan fill="#3DD8E6">/</tspan> PERSONAL BUILD LOG</text>
    <text x="70" y="161" font-size="69" font-weight="800" letter-spacing="-3" fill="#F5F7FF">IDEAS INTO</text>
    <text x="70" y="235" font-size="69" font-weight="800" letter-spacing="-3" fill="url(#glow)">SYSTEMS.</text>
    <text x="75" y="278" font-size="16" font-weight="500" letter-spacing="1.8" fill="#B6C0D8">AI SYSTEMS  ·  SOFTWARE  ·  IMMERSIVE COMPUTING</text>
    <text x="75" y="353" font-size="12" font-weight="700" letter-spacing="2.5" fill="#73819F">LEARN</text>
    <path d="M137 349H182" stroke="#4DD8DE" stroke-width="1.5"/>
    <path d="M176 344L183 349L176 354" fill="none" stroke="#4DD8DE" stroke-width="1.5"/>
    <text x="198" y="353" font-size="12" font-weight="700" letter-spacing="2.5" fill="#73819F">EXPERIMENT</text>
    <path d="M310 349H355" stroke="#4DD8DE" stroke-width="1.5"/>
    <path d="M349 344L356 349L349 354" fill="none" stroke="#4DD8DE" stroke-width="1.5"/>
    <text x="372" y="353" font-size="12" font-weight="700" letter-spacing="2.5" fill="#73819F">BUILD</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" text-anchor="middle">
    <text x="1010" y="214" font-size="98" font-weight="700" letter-spacing="-10" fill="#F5F7FF">0x</text>
    <text x="1010" y="333" font-size="11" letter-spacing="3" fill="#98A7C6">CURIOSITY → ENGINEERING</text>
