<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">Bhuvan0x build constellation</title>
  <desc id="desc">A dark technical constellation map connecting six projects around Bhuvan's engineering interests: data reliability, game systems, input engineering, creative tools, procedural graphics, and autonomous agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset=".55" stop-color="#10172A"/>
      <stop offset="1" stop-color="#121027"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset=".55" stop-color="#7775FF"/>
      <stop offset="1" stop-color="#43D9E6"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#A78BFA" stop-opacity=".82"/>
      <stop offset="1" stop-color="#43D9E6" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#786CFF" stop-opacity=".34"/>
      <stop offset=".65" stop-color="#4A4BD9" stop-opacity=".12"/>
      <stop offset="1" stop-color="#10172A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A8B4D0" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .eyebrow{font:700 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:2.7px;fill:#8290AE}
      .heading{font:800 27px Inter,Segoe UI,Arial,sans-serif;letter-spacing:-.8px;fill:#F3F5FF}
      .sub{font:500 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.4px;fill:#8E9BB8}
      .card{fill:#111A2B;fill-opacity:.94;stroke:#7887A7;stroke-opacity:.23}
      .cardTitle{font:700 15px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.4px;fill:#F0F3FF}
      .cardMeta{font:600 10px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.8px;fill:#8F9FBE}
      .num{font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#45D8DF}
      .mono{font:600 10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.4px;fill:#9AA8C5}
    </style>
  </defs>

  <rect width="1280" height="600" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="600" rx="22" fill="url(#grid)"/>
  <path d="M32 90H1248M32 565H1248" stroke="#8B99B7" stroke-opacity=".14"/>
  <text x="56" y="48" class="eyebrow">BHUVAN0X / FIELD MAP 001</text>
  <text x="56" y="78" class="heading">ONE CURIOSITY. MANY DIRECTIONS.</text>
  <text x="1224" y="51" text-anchor="end" class="eyebrow">IDEAS → SYSTEMS</text>
  <text x="1224" y="74" text-anchor="end" class="sub">A SNAPSHOT OF THE LAB</text>

  <!-- orbital field -->
  <ellipse cx="640" cy="330" rx="268" ry="208" fill="url(#coreGlow)"/>
  <circle cx="640" cy="330" r="164" fill="none" stroke="#8C83FF" stroke-opacity=".16" stroke-dasharray="2 9"/>
  <circle cx="640" cy="330" r="134" fill="none" stroke="#52D8E4" stroke-opacity=".20" stroke-dasharray="4 8"/>
  <ellipse cx="640" cy="330" rx="226" ry="91" fill="none" stroke="#8B83FF" stroke-opacity=".16" transform="rotate(-28 640 330)"/>
  <ellipse cx="640" cy="330" rx="226" ry="91" fill="none" stroke="#52D8E4" stroke-opacity=".13" transform="rotate(28 640 330)"/>

  <!-- constellation links -->
  <g fill="none" stroke="url(#accentLine)" stroke-width="1.6">
    <path d="M370 159H435Q480 159 510 202L548 244"/>
    <path d="M370 314H492Q520 314 540 322"/>
    <path d="M370 469H435Q480 469 510 426L548 388"/>
    <path d="M910 159H845Q800 159 770 202L732 244"/>
    <path d="M910 314H788Q760 314 740 322"/>
    <path d="M910 469H845Q800 469 770 426L732 388"/>
  </g>
  <g fill="#47D9E3">
    <circle cx="548" cy="244" r="4"/><circle cx="540" cy="322" r="4"/><circle cx="548" cy="388" r="4"/>
  </g>
  <g fill="#A78BFA">
    <circle cx="732" cy="244" r="4"/><circle cx="740" cy="322" r="4"/><circle cx="732" cy="388" r="4"/>
  </g>

  <!-- left cards -->
  <g>
    <rect x="56" y="112" width="314" height="94" rx="12" class="card"/>
    <rect x="56" y="112" width="3" height="94" rx="1.5" fill="#A78BFA"/>
    <text x="78" y="139" class="num">01 / DATA SYSTEMS</text>
    <text x="78" y="166" class="cardTitle">AI-NEXUS RADAR</text>
    <text x="78" y="188" class="cardMeta">EXTRACTION · RELIABILITY · REPAIR</text>

    <rect x="56" y="267" width="314" height="94" rx="12" class="card"/>
    <rect x="56" y="267" width="3" height="94" rx="1.5" fill="#43D9E6"/>
    <text x="78" y="294" class="num">02 / GAME SYSTEMS</text>
    <text x="78" y="321" class="cardTitle">WILLED CHESS</text>
    <text x="78" y="343" class="cardMeta">AGENCY · PERSONALITY · STRATEGY</text>

    <rect x="56" y="422" width="314" height="94" rx="12" class="card"/>
    <rect x="56" y="422" width="3" height="94" rx="1.5" fill="#A78BFA"/>
    <text x="78" y="449" class="num">03 / INPUT ENGINEERING</text>
    <text x="78" y="476" class="cardTitle">MOUSE PULSE</text>
    <text x="78" y="498" class="cardMeta">POINTER DATA · DIAGNOSTICS</text>
  </g>

  <!-- right cards -->
  <g>
    <rect x="910" y="112" width="314" height="94" rx="12" class="card"/>
    <rect x="1221" y="112" width="3" height="94" rx="1.5" fill="#43D9E6"/>
    <text x="932" y="139" class="num">04 / CREATIVE TOOLS</text>
    <text x="932" y="166" class="cardTitle">SLIDEFORGE AI</text>
    <text x="932" y="188" class="cardMeta">IDEATION · STRUCTURE · GENERATION</text>

    <rect x="910" y="267" width="314" height="94" rx="12" class="card"/>
    <rect x="1221" y="267" width="3" height="94" rx="1.5" fill="#A78BFA"/>
    <text x="932" y="294" class="num">05 / PROCEDURAL ART</text>
    <text x="932" y="321" class="cardTitle">SHARINGAN TERMINAL</text>
    <text x="932" y="343" class="cardMeta">PYTHON · GEOMETRY · MOTION</text>

    <rect x="910" y="422" width="314" height="94" rx="12" class="card"/>
    <rect x="1221" y="422" width="3" height="94" rx="1.5" fill="#43D9E6"/>
    <text x="932" y="449" class="num">06 / AUTONOMOUS SYSTEMS</text>
    <text x="932" y="476" class="cardTitle">NEONFLUX</text>
    <text x="932" y="498" class="cardMeta">AGENTS · DISCOVERY · AUTOMATION</text>
  </g>

  <!-- central core -->
  <circle cx="640" cy="330" r="113" fill="#11152A" stroke="#A78BFA" stroke-opacity=".35" stroke-width="1.2"/>
  <circle cx="640" cy="330" r="101" fill="none" stroke="url(#accent)" stroke-opacity=".58" stroke-width="1.5"/>
  <circle cx="640" cy="330" r="87" fill="none" stroke="#95A4C4" stroke-opacity=".18" stroke-dasharray="2 6"/>
  <circle cx="640" cy="330" r="75" fill="#141A32"/>
  <circle cx="640" cy="330" r="75" fill="url(#coreGlow)"/>
  <circle cx="640" cy="330" r="75" fill="none" stroke="#A9B7D4" stroke-opacity=".18"/>
  <circle cx="640" cy="255" r="4" fill="#43D9E6" filter="url(#smallGlow)"/>
  <circle cx="715" cy="330" r="4" fill="#A78BFA" filter="url(#smallGlow)"/>
  <circle cx="640" cy="405" r="4" fill="#43D9E6" filter="url(#smallGlow)"/>
  <circle cx="565" cy="330" r="4" fill="#A78BFA" filter="url(#smallGlow)"/>
  <g text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="640" y="300" class="eyebrow" text-anchor="middle">THE BUILDER</text>
    <text x="640" y="339" font-size="27" font-weight="800" letter-spacing="-1" fill="#F4F6FF">BHUVAN0X</text>
    <text x="640" y="365" class="mono" text-anchor="middle">STUDENT / DEVELOPER</text>
    <text x="640" y="385" font-size="9" font-weight="700" letter-spacing="1.8" fill="#49D9E4">AI · SOFTWARE · IMMERSION</text>
  </g>

  <text x="56" y="557" class="eyebrow">NOT SIX RANDOM REPOS.</text>
  <text x="1224" y="557" text-anchor="end" class="eyebrow">SIX WAYS TO EXPLORE A SYSTEM.</text>
  <rect x="1" y="1" width="1278" height="598" rx="21" fill="none" stroke="#A9B7D4" stroke-opacity=".18"/>
</svg>